services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: banking_lab
      POSTGRES_USER: banking_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - banking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_app -d banking_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  banking_pgdata: