services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: banking_lab
      POSTGRES_USER: banking_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - banking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_app -d banking_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.0
    profiles: ["email"]
    restart: "no"
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /tmp/mailpit.db
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  banking_pgdata:
